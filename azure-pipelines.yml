# example file for 3thanPSC.pipelines-java azure-pipelines.yml
# 
# Deploy and compile pipeline
# v0.1

variables:
  DLC: /opt/progress/openedge
  PROPATH: /opt/progress/openedge
  SRC_DIR: $(Build.SourcesDirectory)
  BUILD_DIR: $(Build.SourcesDirectory)/build
  ASSETS: /home/svc-DecadeADO/.azcli/assets
  PROGRADLE: /data/progress/oe128/bin/progradle
  JAVA_HOME: '/usr/lib/jvm/java-17-openjdk'

name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd).$(Rev:r)

trigger: 
    - none

resources:
  repositories:
    - repository: examples          
      type: git                        
      name: Decade/examples    
      ref: main

pool:
  vmImage: 'ubuntu-24.04'

steps:
- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    publishJUnitResults: false
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: false